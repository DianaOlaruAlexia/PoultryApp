<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Health Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Poultry Health Checker</h1>
        
        <div class="form-group">
            <label for="poultry-type">Poultry Type</label>
            <select id="poultry-type">
                <option value="">Select poultry type</option>
                <option value="duck">Duck</option>
                <option value="chicks">Chicks</option>
                <option value="hens">Hens</option>
                <option value="turkey">Turkey</option>
                <option value="goose">Goose</option>
                <option value="chickens">Goose</option>
            </select>
        </div>

        <div class="form-group">
            <label>Symptoms</label>
            <div class="symptoms-container">
                <ul id="available-symptoms"></ul>
                <div id="selected-symptoms">
                    <p id="placeholder">Drag and drop symptoms here</p>
                </div>
            </div>
        </div>

        <button id="submit-btn">Submit</button>

        <div id="response-area"></div>

        <div class="warning">
            <p>This tool is for educational purposes only. Always consult with a veterinarian for accurate diagnosis and treatment.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
